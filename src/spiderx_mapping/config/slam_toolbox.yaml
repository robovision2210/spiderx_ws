# SLAM Toolbox configuration for SpiderX. CONFIGURED BUT BLOCKED (see STATUS.md).
#
# Frames and topic are the real SpiderX ones: /scan (sensor_msgs/LaserScan, frame lidar_link),
# base_link from the URDF. SLAM additionally needs an odom -> dummy_link transform (dummy_link is
# the URDF root, identical to base_link). Nothing publishes that today, because SpiderX has no
# locomotion and no odometry. Do not fake it.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    min_laser_range: 0.15      # matches the simulated/real RPLidar A1 range_min
    max_laser_range: 12.0      # matches range_max
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    # A small, slow robot: add scans after short moves.
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
