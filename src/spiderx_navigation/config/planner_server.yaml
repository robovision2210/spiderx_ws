# CONFIGURED BUT BLOCKED (see STATUS.md): Nav2 needs a /cmd_vel consumer (gait controller)
# and odom -> dummy_link from real odometry. Neither exists yet.
# Frames: base_link from the URDF. NOTE: base_link +y is the robot front (CAD convention, audit
# item T1). Nav2 controllers assume +x forward, so a REP-103 base frame must be added before the
# controller can be used (docs/SPIDERX_DEVELOPMENT_ROADMAP.md).
# Footprint: measured mesh extents in base_link (x -0.043..0.145, y -0.259..0.104) + 0.02 m margin.
# Every velocity/acceleration below is a SIMULATION_PLACEHOLDER (slow on purpose), not a measured
# SpiderX capability.
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.063, -0.279], [-0.063, 0.124], [0.165, 0.124], [0.165, -0.279]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 4.0
          raytrace_min_range: 0.15
          obstacle_max_range: 3.0
          obstacle_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: true
