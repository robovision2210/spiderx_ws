# ros_gz_bridge configuration for the CONTROLLED Fortress simulation (enable_control:=true).
# Same as fortress_bridge.yaml minus /joint_states: joint_state_broadcaster (gz_ros2_control)
# publishes /joint_states directly in this mode, so exactly one publisher exists.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/scan"
  gz_topic_name: "/spiderx/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
