# ros_gz_bridge configuration for the SpiderX Gazebo Fortress simulation.
# Loaded by launch/fortress.launch.py (parameter_bridge, config_file parameter).
#
# Every bridge is one-way, Gazebo -> ROS 2. The Gazebo topics are defined in
# urdf/spiderx_fortress.gazebo.xacro (scan, joint states) and by gz-sim itself (/clock).

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/scan"
  gz_topic_name: "/spiderx/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/spiderx/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
