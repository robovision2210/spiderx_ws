# Nav2 AMCL for SpiderX. CONFIGURED BUT BLOCKED (see STATUS.md).
#
# Uses the real /scan (lidar_link) and URDF frames. AMCL needs odom -> dummy_link from real
# odometry, which does not exist yet.
# OmniMotionModel is an ASSUMPTION: a legged gait can move sideways. Confirm it once the gait
# exists. The alpha noise values are defaults and must be tuned on the real gait.
amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: scan
    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: "likelihood_field"
    laser_min_range: 0.15
    laser_max_range: 12.0
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.05
