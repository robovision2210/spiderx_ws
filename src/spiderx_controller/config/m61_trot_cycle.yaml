# M6.1 - the ONE approved trot gait cycle for protected replay (SIMULATION ONLY).
#
# One start-stop trot cycle as ONE FollowJointTrajectory goal: neutral -> pair A (LF + RR) swings
# while pair B (RF + LR) is in stance -> pair B swings while pair A is in stance -> neutral.
# Owner-approved configuration (2026-10-03): 2 cm step, 6 mm lift, 4.0 s cycle, fixed / clamped
# base, neutral body height. Design: docs/M61_TROT_REPLAY_DESIGN.md section 2.
#
# The waypoints below are DATA, read by spiderx_controller/m61_trot_cycle.py, which refuses the file
# unless (1) its canonical content hashes to content_sha256, (2) every waypoint equals the waypoint
# re-derived from the parameters by the design generator (offline IK, leg_kinematics) within
# m61_limits.yaml source_match_rad, and (3) the parameters equal the owner-approved values
# (m61_live_contract.APPROVED_GAIT). Values are stored with exactly 9 decimals (fixed point, so
# every value parses back to the float that was hashed; "-0.000000000" is a signed zero).
#
# content_sha256 = SHA-256 of the canonical JSON of the design-note scheme
#   {schema: spiderx.m61.trot_cycle.design/0, params, joint_names, points}; reproduced by the
#   design-note generator (section 2.3) with STEP 0.020 and LIFT 0.006.
# design_note_reference_sha256 = the hash quoted in the implementation request. It identifies the
#   design note table for STEP 0.025 / LIFT 0.010 (NOT approved: 0.1517 rad > the 0.1223 rad cap).
#   It is recorded for traceability only and is NOT the hash of this trajectory.
#
# Frame base_link: +x right, +y front (travel), +z up. Units: m, rad, rad/s, s (sim time).
# Joint order = spiderx_ros2_controllers.yaml leg_trajectory_controller.joints.

schema: spiderx.m61.trot_cycle/1
milestone: M6.1
simulation_only: true
gait_name: trot
variant: start_stop_single_cycle
num_cycles: 1
num_waypoints: 9
cycle_duration_s: 4.0
step_length_m: 0.02          # world forward advance of each foot (= body advance per cycle)
lift_height_m: 0.006         # cycloid swing apex
stance_height_offset_m: 0.0  # neutral body height (base_link 0.0545 m above the ground)
lead_in_s: 3.0               # neutral hold before the cycle
segments: 8                  # waypoint spacing = cycle_duration_s / segments = 0.5 s
duty_factor: 0.5
swing_pair_first: [front_left, rear_right]
swing_pair_second: [front_right, rear_left]
