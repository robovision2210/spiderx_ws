# M3 - SIMULATION-ONLY single-leg kinematics validation targets for SpiderX (Gazebo Fortress).
#
# Single-leg simulation kinematics validation. Not walking, not a gait, not balance control,
# not locomotion, not real-world leg control, not hardware validation.
#
# Single source of truth for validate_leg_kinematics, validate_m3_kinematics.sh and the static
# check in validate_controller_config. Geometry is NOT stored here: every length/axis/limit is
# extracted from the expanded URDF by spiderx_controller/leg_kinematics.py.
#
# Targets are OFFSETS (metres, frame base_link) from the reference foot tip = FK of the CAD neutral
# pose (spiderx_poses.yaml cad_neutral, all joints 0 rad). The reference is computed, never typed.
# base_link axes (not REP-103): +x = robot right, +y = robot front, +z = up.
# For the LEFT-front leg, "outward" is -x and "inward" is +x.
#
# Value categories: EXISTING_CONFIG (copied from validated config), SIMULATION_ONLY (chosen for this
# simulation test before the first M3 runtime run; must not be changed to make a run pass).

config_version: 1
date: "2026-09-26"
simulation_only: true
leg: front_left            # joints lf_hip, lf_thigh_joint, lf_foot_joint (spiderx_legs.yaml)
frame: base_link
reference:
  pose: cad_neutral        # EXISTING_CONFIG: spiderx_poses.yaml
  point: derived_foot_tip  # lowest point of the lf_foot_1 collision mesh at q = 0 (leg_kinematics.py)

# EXISTING_CONFIG: M1 safety margin (spiderx_legs.yaml soft_limit_margin_rad); checked equal.
validation_margin_rad: 0.05

tolerances:
  # Math residual |FK(IK(p)) - p|. Must equal leg_kinematics.IK_POSITION_TOL_M (checked).
  ik_position_tol_m: 1.0e-6
  # FK vs TF (robot_state_publisher, same URDF, looked up at the /joint_states stamp).
  fk_vs_tf_position_m: 1.0e-6
  fk_vs_tf_orientation_rad: 1.0e-6
  # SIMULATION_ONLY: FK vs Gazebo ground-truth link pose (physics joint constraints, un-stamped
  # bridge samples taken after the leg has settled).
  fk_vs_gazebo_position_m: 0.001
  fk_vs_gazebo_orientation_rad: 0.005
  # SIMULATION_ONLY: observed foot tip (Gazebo) vs commanded target after settling.
  target_reached_position_m: 0.002

safety:
  # SIMULATION_ONLY: every safe target must keep both IK singularity margins above this.
  min_singularity_margin_rad: 0.2
  # SIMULATION_ONLY: every safe target must lift the foot at least this much (no ground push).
  min_lift_m: 0.005
  # SIMULATION_ONLY: max |q_target - q_cad_neutral| per joint for a safe target.
  max_joint_change_rad: 0.35
  # SIMULATION_ONLY: max offset from the reference in any axis.
  max_offset_m: 0.02

motion:
  # EXISTING_CONFIG-derived: duration >= max(min_duration_s, speed_factor * max|dq| / v_max), with
  # v_max = spiderx_legs.yaml motion_constraints.max_joint_velocity_rad_s (0.5). Factor 2 covers
  # the peak of a cubic profile with zero end velocities (1.5 x average).
  min_duration_s: 3.0
  speed_factor: 2.0
  settle_s: 1.0            # SIMULATION_ONLY, simulation seconds after each trajectory

safe_targets:
  lift_10mm:
    offset_m: [0.0, 0.0, 0.010]
    rationale: straight lift; smallest move that clears the ground
  lift_15mm_forward_10mm:
    offset_m: [0.0, 0.010, 0.015]
    rationale: lift and shift toward the robot front (+y)
  lift_15mm_rearward_10mm:
    offset_m: [0.0, -0.010, 0.015]
    rationale: lift and shift toward the robot rear (-y)
  lift_15mm_outward_8mm:
    offset_m: [-0.008, 0.0, 0.015]
    rationale: lift and shift outward (-x for the left leg); exercises lf_hip
  lift_15mm_inward_8mm:
    offset_m: [0.008, 0.0, 0.015]
    rationale: lift and shift inward (+x); exercises lf_hip with the opposite sign

negative_tests:
  unreachable_300mm_below:
    negative_test_only: true
    offset_m: [0.0, 0.0, -0.30]
    expect: unreachable        # reason unreachable_hip or unreachable_knee; nothing is commanded
    rationale: farther from the thigh axis than the thigh + foot can reach
  outside_joint_limits:
    negative_test_only: true
    from_joint_config_rad: [0.0, 1.2, 0.0]   # lf_thigh_joint 1.2 > URDF upper 0.785398
    expect: joint_limits       # geometrically reachable; every solution violates limits - margin
    rationale: target generated by FK of an out-of-limit configuration; IK must refuse it
