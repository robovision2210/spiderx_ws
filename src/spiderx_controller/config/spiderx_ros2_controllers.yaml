# ros2_control controllers for SpiderX joint position control (M1), Gazebo Fortress + gz_ros2_control.
#
# Loaded by the gz_ros2_control plugin (spiderx_description/urdf/spiderx_fortress_control.xacro)
# when launched with: ros2 launch spiderx_bringup fortress_control.launch.py
# Spawned in order by spiderx_controller/launch/controller.launch.py:
#   1. joint_state_broadcaster  2. leg_trajectory_controller
#
# This is joint-position control only. It is NOT a standing controller, balance controller or gait.
# Joint names are validated against the URDF by validate_controller_config.
# Joint limits come from the URDF <limit> tags (not repeated here).
#
# The legacy Gazebo Classic controller file is spiderx_description/config/controllers.yaml.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz, simulation-only tuning
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

leg_trajectory_controller:
  ros__parameters:
    joints:
      - lf_hip
      - lf_thigh_joint
      - lf_foot_joint
      - rf_hip
      - rf_thigh_joint
      - rf_foot_joint
      - lr_hip
      - lr_thigh_joint
      - lr_foot_joint
      - rr_hip
      - rr_thigh_joint
      - rr_foot_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    # Every goal must name all 12 joints. The test tools hold the non-tested joints at their
    # measured positions.
    allow_partial_joints_goal: false
